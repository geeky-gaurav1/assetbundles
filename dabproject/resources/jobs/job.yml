resources:
  jobs:
    ingestion:
      name: ingestion
      tasks:
        - task_key: ingestion_job
          notebook_task:
            notebook_path: ../..//dabproject/src/notebooks/demo
            base_parameters:
              catalog: ${var.catalog_name}
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
